<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #content {
            text-align: center;
            margin: 20px auto 120px;
            color: #c4dce8;
            font-size: 24px;
            font-weight: normal;
        }

        #name {
            text-align: center;
            margin-top: 100px;
            color: #36d9ff;
            font-size: 60px;
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(54, 217, 255, 0.4);
        }
    </style>
    <link rel="stylesheet" href="/CSS/nav.css">
    <link rel="stylesheet" href="/CSS/ct&footer.css">
    <title>Add creatures</title>
</head>

<body>
    <nav class="navbar">
        <a href="home.html" class="logo">The <span>Abyss</span></a>

        <form class="search-form" action="#" method="get">
            <input type="search" name="creature" placeholder="Creature's name or depth..."
                aria-label="Search for a sea creature or depth">
            <button type="submit">Search</button>
        </form>

        <ul class="nav-links">
            <li>
                <a href="aquarium.html" onclick="return checkAuthNavigation(event, this.href)">
                    Your Aquarium
                </a>
            </li>
            <li>
                <a href="addCre.html" class="add-btn" onclick="return checkAuthNavigation(event, this.href)">
                    Add Creature
                </a>
            </li>
        </ul>

        <!-- Hiện khi CHƯA đăng nhập -->
        <div class="nav-auth" id="nav-auth">
            <a href="login.html" class="login-btn">LOGIN</a>
            <a href="signup.html" class="signup-btn">SIGN UP</a>
        </div>

        <!-- Hiện khi ĐÃ đăng nhập -->
        <div class="nav-user" id="nav-user" style="display:none;">
            <span id="nav-user-email"></span>
            <button type="button" id="logout-btn">LOG OUT</button>
        </div>
    </nav>

    <h1 class="content" id="name">ADD CREATURES</h1>
    <h2 class="content" id="content">Add your favorate fantasy creatures now</h2>

    <footer>
        The Abyss
        Very happy for your visit
        If you have any bad experiences or any questions
        Please connect the phone number 08********
    </footer>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

    <script src="/CONNECT/firebase_config.js"></script>

    <!-- Auth Navbar -->
    <script src="/JS/auth-guard.js"></script>
</body>

</html>
