<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Abyss | Login</title>
    <link rel="stylesheet" href="/CSS/su-lg.css">
</head>

<body>
    <div class="auth-page">
        <a href="index.html" class="back-home">← BACK TO THE ABYSS</a>

        <div class="auth-card">
            <div class="logo">THE <span>ABYSS</span></div>
            <div class="subtitle">OCEAN EXPLORATION SYSTEM</div>

            <div class="auth-heading">
                <h1>WELCOME BACK</h1>
                <p>Sign in to continue your exploration.</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="loginbtn" class="primary-btn">
                    LOGIN
                </button>
            </form>

            <div class="divider"><span>OR</span></div>

            <button id="googlebtn" class="google-btn">
                Continue with Google
            </button>

            <p id="auth-message" class="auth-message"></p>

            <div class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create account</a>
            </div>
        </div>

        <div class="ocean-footer">
            DEEP SEA • UNKNOWN WORLD • DISCOVER
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

    <script src="/CONNECT/firebase_config.js"></script>
    <script src="/JS/su-lg.js"></script>
</body>

</html>
