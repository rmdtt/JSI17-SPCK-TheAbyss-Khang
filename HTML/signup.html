<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Abyss | Sign Up</title>
    <link rel="stylesheet" href="/CSS/su-lg.css">
</head>

<body>
    <div class="auth-page">

        <a href="home.html" class="back-home">
            ← BACK TO THE ABYSS
        </a>

        <div class="auth-card">

            <div class="logo">THE <span>ABYSS</span></div>
            <div class="subtitle">OCEAN EXPLORATION SYSTEM</div>

            <div class="auth-heading">
                <h1>JOIN THE EXPLORATION</h1>
                <p>Create your account and discover the deep sea.</p>
            </div>

            <!-- Signup Form -->
            <form id="signup-form">

                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" id="signupbtn" class="primary-btn">
                    CREATE ACCOUNT
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Google Signup -->
            <button type="button" id="googlebtn" class="google-btn">
                Continue with Google
            </button>

            <p id="auth-message" class="auth-message"></p>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

        <div class="ocean-footer">
            DEEP SEA • UNKNOWN WORLD • DISCOVER
        </div>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

    <!-- Firebase Config -->
    <script src="/CONNECT/firebase_config.js"></script>

    <!-- Shared Authentication JS -->
    <script src="/JS/su-lg.js"></script>

</body>

</html>
